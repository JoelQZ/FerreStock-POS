spring.application.name=pos-backend-springboot
spring.config.import=optional:file:.env[.properties]

server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ferrestock_db}?serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

ferrestock.jwt.secret=${JWT_SECRET:}
ferrestock.cors.origenes=${CORS_ALLOWED_ORIGINS:http://localhost:5174}
